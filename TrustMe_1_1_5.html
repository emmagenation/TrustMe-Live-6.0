<!DOCTYPE html>
<html lang="en">

<meta name="theme-color" content="#24425E">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* ===== INTRO ANIMATION STYLES (from Animation Claude 2.0) ===== */
:root{
  --bg:#E3E6DD; --text:#1B2B3B; --ink:#24425E; --badge-fill:#F4F6F0; --line:rgba(36,66,94,.35);
  --font-intro:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1E16; --text:#E6ECF4; --ink:#9DB8DD; --badge-fill:#2A312F; --line:rgba(157,184,221,.40);
  }
}
:root[data-theme="dark"]{
  --bg:#1B1E16; --text:#E6ECF4; --ink:#9DB8DD; --badge-fill:#2A312F; --line:rgba(157,184,221,.40);
}

#introScreen {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-intro);
  transition: background .3s, color .3s;
  display: grid;
  place-items: center;
  overflow: hidden;
  padding: 2rem 1rem 5rem;
}
#introScreen.hidden {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}
.intro-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
}
.intro-iconwrap {
  position: relative;
  width: clamp(200px, 42vmin, 320px);
  aspect-ratio: 1;
}
.intro-icon {
  position: relative;
  width: 100%;
  height: 100%;
  display: block;
  color: var(--ink);
}
.intro-pulse {
  position: absolute;
  inset: 14.5%;
  border-radius: 50%;
  border: 2px solid var(--ink);
  opacity: 0;
}
.intro-word {
  overflow: hidden;
  padding: .05em .1em .12em;
}
.intro-word span {
  display: block;
  font-weight: 800;
  font-size: clamp(2.7rem, 10vw, 4.6rem);
  letter-spacing: -.035em;
  line-height: 1;
}
.intro-badge {
  display: inline-flex;
  align-items: center;
  gap: .7rem;
  margin-top: .6rem;
  padding: .7rem 1.3rem .7rem 1rem;
  border: 3px solid var(--ink);
  border-radius: 7px;
  background: var(--badge-fill);
  color: var(--ink);
  transform: rotate(-5deg);
  font-weight: 800;
  font-size: clamp(.9rem, 3.6vw, 1.3rem);
  letter-spacing: .07em;
  text-transform: uppercase;
  white-space: nowrap;
}
.intro-badge svg {
  width: 1.35em;
  height: 1.35em;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.intro-mark {
  stroke-dasharray: 1;
}

@media (prefers-reduced-motion: no-preference){
  .intro-run .intro-mark { animation: intro-draw var(--t, .5s) cubic-bezier(.6,.05,.2,1) var(--d, 0s) backwards; }
  .intro-run .intro-inner { animation: intro-fade .6s ease-out 1.1s backwards; }
  .intro-run .intro-dots { transform-box: fill-box; transform-origin: center; animation: intro-dots 1.1s cubic-bezier(.2,.8,.2,1) 1.2s backwards; }
  .intro-run .intro-thud { transform-origin: 256px 256px; animation: intro-thud .38s ease-out 2s; }
  .intro-run .intro-pulse { animation: intro-pulse .95s ease-out 2s; }
  .intro-run .intro-word span { animation: intro-rise .65s cubic-bezier(.2,.8,.2,1) 2.1s backwards; }
  .intro-run .intro-badge { animation: intro-stamp .5s cubic-bezier(.3,1.2,.5,1) 2.7s backwards; }
  .intro-run .intro-badge .intro-mark { --d: 3.05s; --t: .4s; }
}
@keyframes intro-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes intro-fade { from { opacity: 0; } }
@keyframes intro-dots { from { opacity: 0; transform: rotate(-40deg); } }
@keyframes intro-thud { 0%, 100% { transform: scale(1); } 40% { transform: scale(.94); } }
@keyframes intro-pulse { from { opacity: .55; transform: scale(1); } to { opacity: 0; transform: scale(1.5); } }
@keyframes intro-rise { from { transform: translateY(110%); } }
@keyframes intro-stamp {
  from { opacity: 0; transform: rotate(-10deg) scale(1.7); }
  60% { opacity: 1; transform: rotate(-5deg) scale(.96); }
}

/* ===== APP STYLES (from TrustMe 1.0.4) ===== */
:root{
  --paper:#E9EBE3; --paper-2:#F3F4EE; --card:#FFFFFF;
  --ink:#1B2015; --ink-2:#4A5140; --ink-3:#7A8170;
  --rule:#CFD3C4; --rule-2:#DDE0D5;
  --stamp:#24425E; --stamp-soft:#24425E1A;
  --khaki:#8E7A42; --khaki-soft:#8E7A4218;
  --clay:#96442A; --clay-soft:#96442A18;
  --olive:#4A5233;
  --shadow:0 1px 0 #CFD3C4, 0 8px 24px -16px #1B201540;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141810; --paper-2:#1C2117; --card:#212719;
    --ink:#E8EADF; --ink-2:#AFB6A3; --ink-3:#7C8471;
    --rule:#333A28; --rule-2:#2A3020;
    --stamp:#8FB6DC; --stamp-soft:#8FB6DC1F;
    --khaki:#C9B274; --khaki-soft:#C9B27418;
    --clay:#D98A66; --clay-soft:#D98A6618;
    --olive:#9FAE7C;
    --shadow:0 1px 0 #2A3020, 0 8px 24px -16px #000000A0;
  }
}
:root[data-theme="dark"]{
  --paper:#141810; --paper-2:#1C2117; --card:#212719;
  --ink:#E8EADF; --ink-2:#AFB6A3; --ink-3:#7C8471;
  --rule:#333A28; --rule-2:#2A3020;
  --stamp:#8FB6DC; --stamp-soft:#8FB6DC1F;
  --khaki:#C9B274; --khaki-soft:#C9B27418;
  --clay:#D98A66; --clay-soft:#D98A6618;
  --olive:#9FAE7C;
  --shadow:0 1px 0 #2A3020, 0 8px 24px -16px #000000A0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Karla,'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.phone{width:100%;max-width:412px;background:var(--paper-2);border:1px solid var(--rule);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;height:min(860px,calc(100vh - 48px));position:relative;box-shadow:0 40px 80px -40px #1B201566}
@media (max-width:480px){ .stage{padding:0} .phone{border:0;border-radius:0;height:100vh;max-width:none} }
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 4px;font-size:11px;color:var(--ink-3);flex:none;font-variant-numeric:tabular-nums}
.view{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 20px 28px}
.view::-webkit-scrollbar{width:0}

h1,h2,h3,.disp{font-family:'Bricolage Grotesque',Karla,sans-serif;font-weight:600;letter-spacing:-.02em;margin:0}
h1{font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.035em}
h2{font-size:20px;line-height:1.2}
h3{font-size:16px;line-height:1.25}
p{margin:0 0 12px}
.lede{color:var(--ink-2);font-size:15px;max-width:34ch}
.small{font-size:13px;color:var(--ink-2)}
.tiny{font-size:11.5px;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}

.seal{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--stamp);color:var(--stamp);padding:3px 8px 2px;border-radius:3px;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.04em;transform:rotate(-2.5deg);background:var(--stamp-soft);white-space:nowrap}
.seal svg{width:11px;height:11px;flex:none}
.seal.lg{font-size:13px;padding:6px 12px 5px;border-width:2px;transform:rotate(-3deg);gap:7px}
.seal.lg svg{width:15px;height:15px}
.seal.pending{border-color:var(--khaki);color:var(--khaki);background:var(--khaki-soft);transform:rotate(1.5deg)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:12px;background:var(--ink);color:var(--paper);font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:15px;transition:transform .12s ease,opacity .12s ease}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn.quiet{background:transparent;color:var(--ink-2);font-weight:500;padding:12px}
.btn.stamp{background:var(--stamp);color:#fff}
:root[data-theme="dark"] .btn.stamp{color:#0E1620}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.stamp{color:#0E1620}}
.btn.danger{background:transparent;color:var(--clay);border:1px solid var(--clay)}
.btn.sm{width:auto;padding:9px 14px;font-size:13px;border-radius:9px}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}

.card{background:var(--card);border:1px solid var(--rule-2);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;align-items:flex-start}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.divide{border-top:1px solid var(--rule-2);margin:16px 0}
.stack>*+*{margin-top:10px}

.avatar{width:46px;height:46px;border-radius:11px;flex:none;background:var(--khaki-soft);border:1px solid var(--rule-2);display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:17px;color:var(--khaki)}
.avatar.big{width:68px;height:68px;border-radius:16px;font-size:24px}
.avatar{overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}

.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--rule);font-size:13px;color:var(--ink-2);background:var(--card);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 2px;margin:0 -20px;scrollbar-width:none}
.scroller::-webkit-scrollbar{height:0}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.tile{background:var(--card);border:1px solid var(--rule-2);border-radius:13px;padding:13px;text-align:left;display:flex;flex-direction:column;gap:7px;min-height:88px;justify-content:space-between}
.tile .ico{font-size:19px;line-height:1}
.tile .nm{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:14px}
.tile .ct{font-size:11.5px;color:var(--ink-3)}
.tile .ct.thin{color:var(--clay)}

.prog{display:flex;gap:5px;padding:12px 0 18px}
.prog i{height:3px;flex:1;border-radius:2px;background:var(--rule)}
.prog i.on{background:var(--stamp)}

.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--rule);background:var(--card)}
.field textarea{resize:vertical;min-height:70px}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-3)}
.otp{display:flex;gap:8px;justify-content:space-between}
.otp input{width:100%;aspect-ratio:1/1.15;text-align:center;font-size:22px;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;border:1px solid var(--rule);border-radius:12px;background:var(--card);font-variant-numeric:tabular-nums}

.esc{display:flex;align-items:center;gap:0;margin:14px 0 6px}
.esc .dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--rule);flex:none;background:var(--card)}
.esc .dot.done{background:var(--stamp);border-color:var(--stamp)}
.esc .dot.now{border-color:var(--stamp);box-shadow:0 0 0 4px var(--stamp-soft)}
.esc .bar{height:2px;flex:1;background:var(--rule)}
.esc .bar.done{background:var(--stamp)}
.esclabels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3)}

.rev{border-top:1px solid var(--rule-2);padding-top:12px;margin-top:12px}
.stars{color:var(--khaki);font-size:12px;letter-spacing:1px}

.tabbar{flex:none;display:flex;border-top:1px solid var(--rule);background:var(--paper-2);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;font-size:10.5px;color:var(--ink-3);border-radius:10px}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar svg{width:21px;height:21px;stroke-width:1.7;fill:none;stroke:currentColor}
.tabbar button[aria-current="page"] svg{stroke-width:2.2}

.banner{border:1px solid var(--stamp);background:var(--stamp-soft);border-radius:13px;padding:14px;margin-bottom:14px}
.banner.warn{border-color:var(--clay);background:var(--clay-soft)}
.banner.wait{border-color:var(--khaki);background:var(--khaki-soft)}

.empty{text-align:center;padding:34px 16px;border:1px dashed var(--rule);border-radius:14px}

.hdr{padding:14px 0 12px;display:flex;align-items:center;gap:10px}
.back{width:34px;height:34px;border-radius:9px;border:1px solid var(--rule);display:grid;place-items:center;flex:none}
.back svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none}

.toast{position:absolute;left:16px;right:16px;bottom:78px;z-index:50;background:var(--ink);color:var(--paper);padding:13px 16px;border-radius:12px;font-size:13.5px;box-shadow:0 12px 32px -12px #000000A0}
.sheet{position:absolute;inset:0;z-index:60;background:#000000A0;display:flex;align-items:flex-end}
.lightbox{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:24px}
.lightbox img{max-width:100%;max-height:100%;border-radius:14px;object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.lightbox-x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:16px;display:grid;place-items:center;border:none}
.avatar.clickable{cursor:pointer}
.sheet>div{background:var(--paper-2);width:100%;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--rule);max-height:88%;overflow-y:auto}
.grab{width:38px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 16px}

.themetoggle{position:absolute;top:8px;right:14px;z-index:40;width:30px;height:30px;border-radius:8px;border:1px solid var(--rule);display:grid;place-items:center;background:var(--card);color:var(--ink-2)}
.bell{position:relative;flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--rule);display:grid;place-items:center;background:var(--card);color:var(--ink)}
.bell svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bell b{position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--stamp);color:#fff;font:700 10px/17px Karla,sans-serif;text-align:center}
:root[data-theme="dark"] .bell b{color:#0E1620}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bell b{color:#0E1620}}
.card.unseen{border-color:var(--stamp);box-shadow:0 0 0 2px var(--stamp-soft)}
.themetoggle svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

.pricepill{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
.meta{font-size:12px;color:var(--ink-3)}
.dist{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.link{color:var(--stamp);text-decoration:underline;text-underline-offset:2px}

/* chat */
.chatwrap{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.bubble{max-width:80%;padding:10px 13px;border-radius:15px;font-size:13.5px;line-height:1.4;position:relative;touch-action:pan-y;will-change:transform}
.bubble.me{background:var(--ink);color:var(--paper);margin-left:auto;border-bottom-right-radius:4px}
.bubble.them{background:var(--card);border:1px solid var(--rule-2);margin-right:auto;border-bottom-left-radius:4px}
.bubble.armed{box-shadow:0 0 0 2px var(--stamp) inset}
.bubble .quote{font-size:11.5px;opacity:.72;border-left:2px solid currentColor;padding:3px 8px;margin-bottom:6px;border-radius:4px;background:rgba(127,127,127,.14)}
.bubble .msgimg{max-width:100%;border-radius:10px;display:block;margin-top:2px}
.bubble .msgtext{margin-top:6px}
.bubble .msgtext:first-child{margin-top:0}
.replybar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--rule-2);border-radius:12px;padding:8px 10px;margin-top:8px}
.replybar-body{flex:1;min-width:0}
.replybar-name{display:block;font-size:11px;font-weight:600;opacity:.7}
.replybar-snip{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.replybar-x{width:24px;height:24px;border-radius:50%;background:var(--rule-2);flex:none;display:grid;place-items:center;font-size:11px}
.chatimgprev{position:relative;width:84px;margin-top:8px}
.chatimgprev img{width:84px;height:84px;object-fit:cover;border-radius:10px;display:block}
.chatimgprev button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;display:grid;place-items:center;line-height:1}
.dthread{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.bubble.sys{align-self:center;max-width:92%;background:transparent;border:1px dashed var(--rule);color:var(--ink-3);font-size:12px;text-align:center;border-radius:12px}
.bubble .dwhen{font-size:10.5px;opacity:.65;margin-top:4px}
.dpick{display:inline-flex;width:auto;cursor:pointer}
.dpick svg{width:16px;height:16px}
.dphoto{margin:0 0 12px}
.dphoto .tiny{margin:6px 0 0}
.bubble .msgimg{cursor:zoom-in}
.chatinput{display:flex;gap:8px;position:sticky;bottom:0;background:var(--paper-2);padding-top:8px}
.chatinput input{flex:1;padding:12px 14px;border-radius:22px;border:1px solid var(--rule);background:var(--card)}
.chatinput button{width:42px;height:42px;border-radius:50%;background:var(--stamp);color:#fff;flex:none;display:grid;place-items:center}
.attachbtn{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--rule-2);flex:none;display:grid;place-items:center;cursor:pointer}
.attachbtn svg{width:18px;height:18px}

/* calendar */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calday{aspect-ratio:1;border-radius:9px;border:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;background:var(--card);gap:2px}
.calday b{font-size:14px;font-family:'Bricolage Grotesque',sans-serif}
.calday[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.uploadbox{border:1.5px dashed var(--rule);border-radius:13px;padding:22px 16px;text-align:center;color:var(--ink-3);width:100%}
.uploadbox.done{border-style:solid;border-color:var(--stamp);color:var(--stamp);background:var(--stamp-soft)}
.piclabel{display:block;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.picrow{display:flex;gap:16px;align-items:center}
.picprev{width:92px;height:92px;flex:none;border-radius:50%;border:1.5px dashed var(--rule);display:grid;place-items:center;color:var(--ink-3);overflow:hidden;background:var(--card);font-size:11px;text-align:center}
.picprev svg{width:30px;height:30px}
.picprev.has{border-style:solid;border-color:var(--stamp)}
.picprev img{width:100%;height:100%;object-fit:cover;display:block}
.picbtns{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}

(function() {
  var intro = document.getElementById('introScreen');
  var appRoot = document.getElementById('appRoot');
  var introDuration = 3600; // total animation duration in ms

  // If the phone reloaded the page while the camera was open, go straight back to the app.
  try {
    if (sessionStorage.getItem('tm-resume') === '1' && sessionStorage.getItem('tm-snap')) {
      intro.style.display = 'none';
      appRoot.classList.add('visible');
      return;
    }
  } catch (e) {}

  // Start animation
  function startIntro() {
    intro.classList.add('intro-run');
    setTimeout(function() {
      intro.classList.add('hidden');
      appRoot.classList.add('visible');
      // Remove intro from DOM after fade
      setTimeout(function() {
        intro.style.display = 'none';
      }, 600);
    }, introDuration);
  }

  // Ensure animation starts on load
  if (document.readyState === 'complete') {
    startIntro();
  } else {
    window.addEventListener('load', startIntro);
  }
})();

function paintToggle(){
  const cur=document.documentElement.dataset.theme;

  if (tt) {
    tt.innerHTML = dark
      ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M21 13.2A9 9 0 1 1 10.8 3a7 7 0 0 0 10.2 10.2z"/></svg>';
  }
}

function badge(v){
  return v.verified
    ? `<span class="seal">${SEAL} VERIFIED</span>`
    : `<span class="seal pending">${CLOCKI} PENDING</span>`;
}
function badgeLg(v){
  return v.verified
    ? `<span class="seal lg">${SEAL} TRUST ME VERIFIED</span>`
    : `<span class="seal lg pending">${CLOCKI} VERIFICATION PENDING</span>`;
}
function recomputeScore(v){
  v.score = Math.max(0, Math.min(100, Math.round(50 + v.rate*10 - v.disputes*8)));
}
function phoneFor(v){ return '0803 '+String(100+v.id).slice(-3)+' '+String(1000+v.id*37).slice(-4); }

function supply(catId){
  let list = V.filter(v=>v.id!==S.myVendorId&&(!catId||(v.cats||[v.cat]).includes(catId)));
  if(S.phase==='ppa') list = list.filter(v=>['phone','hair','house','food','move','electric','plumb','clean'].includes(v.cat));
  if(S.budget==='low') list = list.filter(v=>lowPrice(v)<=15000);
  if(S.query && S.query.trim()){
    const q=S.query.trim().toLowerCase();
    list = list.filter(v=>{
      const c=cat(v.cat);
      return v.nm.toLowerCase().includes(q) || v.trade.toLowerCase().includes(q) ||
        v.area.toLowerCase().includes(q) || (c&&c.nm.toLowerCase().includes(q)) ||
        v.pkgs.some(p=>p.nm.toLowerCase().includes(q)) ||
        (v.units&&v.units.items.some(i=>i.nm.toLowerCase().includes(q)));
    });
  }
  if(S.comesToMe) list = list.filter(v=>v.home);
  if(S.freeToday) list = list.filter(v=>v.today);
  if(S.topRated) list = [...list].sort((a,b)=>b.rate-a.rate);
  return list;
}
function countFor(c){ return supply(c.id).length; }

/* ============ PORTFOLIO GALLERY ============
   Separate from the one profile picture: vendors (photographers, tailors, and anyone else whose
   work is easier to trust once you can see it) can add a handful of past-work photos to their listing. */
const MAX_GALLERY=12;
const GALLERY_HINTS={photo:'Show a few of your best shots — corps members book photographers by what they can see.',
  tailor:'Photos of outfits you have sewn help corps members trust your fit and finishing before they order.',
  makeup:'A few looks you have done before help corps members know your style before they book.',
  hair:'Photos of styles you have done help corps members pick you with confidence.',
  carpenter:'Photos of furniture or fittings you have made help corps members see your work upfront.',
  weld:'Photos of past jobs help corps members see the quality of your work before they call.'};
function galleryHint(catId){ return GALLERY_HINTS[catId]||'A few photos of past work help corps members trust you before they book.'; }
async function addGalleryPhoto(el){
  const fl=el.files&&el.files[0];
  disarmResume();
  if(!fl) return;
  const v=myV(); if(!v) return;
  if((v.gallery||[]).length>=MAX_GALLERY){ S.galErr='You can keep up to '+MAX_GALLERY+' photos. Remove one first.'; render(); return; }
  S.galBusy=true; S.galErr=''; render();
  try{
    const img=await shrinkPhoto(fl,{max:1280,q:0.82});
    const r=await tmApi('POST','/me/gallery',{img});
    if(r.ok){ v.gallery=(v.gallery||[]).concat({id:r.j.id,img:r.j.img}); }
    else{ S.galErr=(r.j&&r.j.error)||'That photo could not be saved. Please try again.'; }
  }catch(e){ S.galErr='That photo would not open. Please try another one.'; }
  S.galBusy=false; el.value=''; render();
}
async function removeGalleryPhoto(id){
  const v=myV(); if(!v) return;
  const before=v.gallery||[];
  v.gallery=before.filter(g=>g.id!==id); render();
  const r=await tmApi('DELETE','/me/gallery/'+id);
  if(!r.ok){ v.gallery=before; toast('Could not remove that photo. Please try again.'); render(); }
}

/* A phone camera photo is often 5-15 MB. Holding it whole is what makes some phones run out of
   memory. Shrink it straight away and keep only a small JPEG (roughly 50-150 KB). */
async function shrinkPhoto(file,opt){
  opt=opt||{};
  const max=opt.max||1280, q=opt.q||0.82, square=!!opt.square;
  if(file.type && !/^image\//i.test(file.type)) throw new Error('not an image');
  let src=null, bmp=null, url=null, w=0, h=0;
  try{
    if(window.createImageBitmap){
      try{ bmp=await createImageBitmap(file,{imageOrientation:'from-image'}); }
      catch(e){ try{ bmp=await createImageBitmap(file); }catch(e2){ bmp=null; } }
    }
    if(bmp){ src=bmp; w=bmp.width; h=bmp.height; }
    else{
      url=URL.createObjectURL(file);
      const img=new Image();
      await new Promise((ok,no)=>{ img.onload=ok; img.onerror=()=>no(new Error('decode')); img.src=url; });
      src=img; w=img.naturalWidth; h=img.naturalHeight;
    }
    if(!w||!h) throw new Error('empty image');
    const c=document.createElement('canvas'), x=c.getContext('2d');
    if(square){
      const side=Math.min(w,h), out=Math.min(side,max);
      c.width=c.height=out;
      x.fillStyle='#fff'; x.fillRect(0,0,out,out);
      x.drawImage(src,(w-side)/2,(h-side)/2,side,side,0,0,out,out);
    } else {
      const k=Math.min(1,max/Math.max(w,h));
      c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h*k));
      x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
      x.drawImage(src,0,0,c.width,c.height);
    }
    const data=c.toDataURL('image/jpeg',q);
    c.width=c.height=0;
    if(data.length<100) throw new Error('encode');
    return data;
  } finally {
    if(bmp&&bmp.close) bmp.close();
    if(url) URL.revokeObjectURL(url);
  }
}

/* Some phones close the page while the camera is open (they need the memory for the camera app),
   and when you come back the page starts again from the top. So just before the camera opens we
   save where you are, and if the page comes back reloaded we put you straight back there. */
function armResume(){
  try{
    sessionStorage.setItem('tm-snap',JSON.stringify({t:Date.now(),PK:PK,S:Object.assign({},S,{toast:null}),V:V}));
    sessionStorage.setItem('tm-resume','1');
  }catch(e){}
}
function disarmResume(){ try{ sessionStorage.removeItem('tm-resume'); sessionStorage.removeItem('tm-snap'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') setTimeout(disarmResume,2500); });

/* The profile picture lives in View profile > Edit profile. S.pic feeds the You tab,
   and the vendor's own listing carries the same photo so corps members see it in search. */
function syncMyPhoto(){ const v=S.myVendorId?V.find(x=>x.id===S.myVendorId):null; if(v) v.photo=S.pic||null; }
async function editPic(el){
  const fl=el.files&&el.files[0];
  disarmResume();

  S.picBusy=true; S.picErr=''; render();
  try{ S.pic=await shrinkPhoto(fl,{max:640,square:true,q:0.86}); syncMyPhoto(); }
  catch(e){ S.picErr='That photo would not open. Please try another one.'; }
  S.picBusy=false; render();
}
function editPicRemove(){ S.pic=null; S.picErr=''; syncMyPhoto(); render(); }

function otpHop(el,i){ const boxes=[...document.querySelectorAll('.otp input')]; if(el.value && i<boxes.length-1) boxes[i+1].focus(); }
function otpBack(e,el,i){ if(e.key==='Backspace' && !el.value && i>0){ const boxes=[...document.querySelectorAll('.otp input')]; boxes[i-1].focus(); } }
function next(){ const steps=onbSteps(); if(S.step<steps.length-1){S.step++;render();$('view').scrollTop=0;} else finish(); }

function finish(){
  if(S.role==='vendor' && !S.myVendorId){
    const c=cat(S.vCat), isUnit=!!UNIT_CATS[S.vCat];
    const nv={
      id:S.uid?idn(S.uid):Date.now(), nm:S.name||'New vendor', cat:S.vCat, cats:[S.vCat], trade:c?c.nm:'Services',
      area:S.camp.split(' — ')[1]||S.camp, km:0.3,
      jobs:0, rate:0, since:S.batch+', '+(new Date().getFullYear()),
      score:38, home:false, today:false, verified:false, disputes:0,
      ver:['ID submitted','Photo attached','Awaiting physical check (due within 14 days)'],
      pkgs:isUnit?[]:[{id:nid(),nm:S.vPkgName.trim(),price:pn(S.vPkgFee),desc:'',dur:''}],
      units:isUnit?unitsTemplate(S.vCat):null, revs:[]
    };
    V.unshift(nv); S.myVendorId=nv.id;
  }
  if(TOKEN && !S.hasPin){ S.pinFlow='onboard'; S.pinForm={a:'',b:'',old:'',err:'',busy:false}; S.screen='setpin'; render(); return; }
  S.screen='app'; S.tab='home'; render();
  toast(S.role==='vendor' ? 'You are listed with a pending badge. We visit within 14 days.' : 'You are in. '+supply().length+' vendors near '+S.camp.split(' — ')[1]+'.');
}

/* ============ LOGIN PIN ============
   Opens the app on this phone. Kept separate from the phone OTP: if the phone (and SIM) is stolen,
   the PIN is the one thing the thief does not automatically have. */
function scrSetPin(){
  const f=S.pinForm, changing=S.pinFlow==='change';
  return `
  <div class="hdr">${changing?`<button class="back" onclick="S.pinFlow=null;S.tab='me';go('app')" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>`:''}<h2>${changing?'Change your login PIN':'Create a login PIN'}</h2></div>
  <p class="lede" style="margin:8px 0 18px">${changing?'Enter your current PIN, then choose a new one.':'A 4-digit PIN to open Trust Me on this phone. If it is ever lost or stolen, this keeps your account out of reach.'}</p>
  ${changing?`<label class="field"><span>Current PIN</span><input type="password" inputmode="numeric" maxlength="4" value="${esc(f.old||'')}" oninput="S.pinForm.old=this.value.replace(/\\D/g,'')"></label>`:''}
  <label class="field"><span>${changing?'New 4-digit PIN':'Choose a 4-digit PIN'}</span>
    <input type="password" inputmode="numeric" maxlength="4" value="${esc(f.a)}" oninput="S.pinForm.a=this.value.replace(/\\D/g,'')"></label>
  <label class="field"><span>Confirm PIN</span>
    <input type="password" inputmode="numeric" maxlength="4" value="${esc(f.b)}" oninput="S.pinForm.b=this.value.replace(/\\D/g,'')"></label>
  ${f.err?`<p class="tiny" style="color:var(--clay);margin:-6px 0 12px">${esc(f.err)}</p>`:''}
  ${f.busy?'<button class="btn" disabled>Saving…</button>':'<button class="btn stamp" onclick="submitSetPin()">Save PIN</button>'}
  ${changing?'':'<p class="tiny" style="margin:12px 0 0">You will need this PIN whenever you reopen the app.</p>'}`;
}
async function submitSetPin(){
  const f=S.pinForm, changing=S.pinFlow==='change';
  if(changing && !/^\d{4}$/.test(f.old||'')){ f.err='Enter your current PIN.'; render(); return; }
  if(!/^\d{4}$/.test(f.a)){ f.err='Enter a 4-digit PIN.'; render(); return; }
  if(f.a!==f.b){ f.err='The PINs do not match.'; render(); return; }
  f.busy=true; f.err=''; render();
  const body={pin:f.a}; if(changing) body.oldPin=f.old;
  const r=await tmApi('POST','/auth/pin',body); f.busy=false;
  if(!r.ok){ f.err=r.j.error||'Could not save the PIN. Try again.'; render(); return; }
  S.hasPin=true; unlocked=true; const flow=S.pinFlow; S.pinFlow=null; S.pinForm={a:'',b:'',old:'',err:'',busy:false};

async function submitLockPin(){

function scrPinReset(){

async function sendPinResetOtp(){
  const f=S.prForm; f.busy=true; f.err=''; render();
  const r=await tmApi('POST','/auth/request-otp',{phone:S.phone}); f.busy=false;

  f.sent=true; f.code=''; f.devCode=r.j.devCode||''; render();
}
async function submitPinReset(){
  const f=S.prForm;
  if(!/^\d{4,6}$/.test(f.code.trim())){ f.err='Enter the code.'; render(); return; }
  if(!/^\d{4}$/.test(f.a)){ f.err='Enter a 4-digit PIN.'; render(); return; }
  if(f.a!==f.b){ f.err='The PINs do not match.'; render(); return; }
  f.busy=true; f.err=''; render();
  const r=await tmApi('POST','/auth/pin/reset',{phone:S.phone,code:f.code.trim(),pin:f.a}); f.busy=false;
  if(!r.ok){ f.err=r.j.error||'Could not reset the PIN. Try again.'; render(); return; }
  if(r.j.token){ TOKEN=r.j.token; try{ localStorage.setItem('tm-token',TOKEN); }catch(e){} }
  S.hasPin=true; unlocked=true; resetPrForm();
  S.screen='app'; S.tab='home'; render();
  toast('Your PIN has been reset.');
}

function setVendorLocation(){
  if(!navigator.geolocation){ S.locErr='Location is not available on this device.'; render(); return; }
  S.locBusy=true; S.locErr=''; render();
  navigator.geolocation.getCurrentPosition(async pos=>{
    const loc={lat:pos.coords.latitude,lng:pos.coords.longitude};
    const r=await tmApi('PATCH','/me',{loc});
    S.locBusy=false;
    if(r.ok){ const v=myV(); if(v) v.loc=loc; toast('Location saved.'); }
    else S.locErr=r.j.error||'Could not save your location.';
    render();
  },err=>{
    S.locBusy=false; S.locErr=(err&&err.code===1)?'Location permission was denied.':'Could not get your location.'; render();
  },{enableHighAccuracy:true,timeout:10000});
}

/* Swipe a message bubble right to quote it in a reply — delegated on document since #view is
   rebuilt on every render(). Works with touch, mouse and pen (Pointer Events). */
let swEl=null, swX=0, swY=0, swDX=0, swIdx=-1, swActive=false;
function endSwipe(commit){
  if(!swEl) return;
  const el=swEl, idx=swIdx, arm=swDX>40;
  el.style.transition='transform .18s ease'; el.style.transform='translateX(0)'; el.classList.remove('armed');
  setTimeout(()=>{ if(el) el.style.transition=''; },200);
  swEl=null; swActive=false;
  if(commit&&arm&&idx>=0) beginReplyAt(idx);
}
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest&&e.target.closest('.chatwrap .bubble'); if(!b) return;
  swEl=b; swX=e.clientX; swY=e.clientY; swDX=0; swActive=false; swIdx=+b.dataset.idx;
});
document.addEventListener('pointermove',e=>{
  if(!swEl) return;
  const dx=e.clientX-swX, dy=e.clientY-swY;
  if(!swActive){ if(Math.abs(dx)<8&&Math.abs(dy)<8) return; if(Math.abs(dy)>Math.abs(dx)){ swEl=null; return; } swActive=true; e.preventDefault(); }
  swDX=Math.max(0,Math.min(dx,64));
  swEl.style.transform='translateX('+swDX+'px)';
  swEl.classList.toggle('armed',swDX>40);
});
document.addEventListener('pointerup',()=>endSwipe(true));
document.addEventListener('pointercancel',()=>endSwipe(false));

async function cancelBooking(id){
  if(cancelling) return;
  const b=S.bookings.find(x=>x.id===id); if(!b||b.stage!==1||b.cancelled) return;
  const v=vOf(b);

  if(!b.srv){ b.cancelled=true; render(); toast('Booking cancelled.'); return; }
  cancelling=true; const r=await tmApi('POST','/bookings/'+b.srv+'/cancel'); cancelling=false;
  if(!r.ok){ toast(r.j.error||'Could not cancel this booking.'); return; }
  b.cancelled=true; b.refunded=!!(r.j&&r.j.refunded); bSig=''; render(); toast(b.refunded?'Booking cancelled. Your '+naira(b.price)+' refund has started.':'Booking cancelled.');
}

/* ============ DISPUTES ============
   Two-way: the corps member opens a dispute on a finished job, the vendor answers it, and both write into one thread on the server.
   Either side can attach photo evidence. The payment stays held until the corps member closes it.
   Disputes on the built-in demo vendors are still local to this device. */
const D_MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dateLbl=ms=>{ const d=new Date(ms); return D_MON[d.getMonth()]+' '+d.getDate(); };
const dReasonLbl=r=>{ const i=DISPUTE_REASONS.indexOf(r); return i>=0?tr('d_r'+i):r; };     // the server keeps the English reason; the screen shows it in the chosen language
let dSig='', dBusy=false;
const DIMG={}, DIMG_TRY={};     // photo evidence is fetched one photo at a time and kept for this visit; TRY: 1 = loading, 2 = failed
function dFromSrv(d){
  const o=d.other||{};
  return {id:idn(d.id),srv:d.id,bookingSrv:d.bookingId,mine:d.mine,what:d.what,price:d.price,reason:d.reason,status:d.status,created:d.created,updated:d.updated,
    otherName:o.name||'',thread:d.thread||[],date:dateLbl(d.created)};
}
function applyDispute(j){ const n=dFromSrv(j), i=S.disputes.findIndex(x=>x.srv===n.srv); if(i>=0) S.disputes[i]=n; else S.disputes.unshift(n); }
async function pullDisputes(){
  if(!TOKEN||!synced) return;
  const r=await tmApi('GET','/disputes'); if(!r.ok) return;
  const sig=JSON.stringify(r.j); if(sig===dSig) return; dSig=sig;
  S.disputes=r.j.map(dFromSrv).concat(S.disputes.filter(d=>!d.srv));
  if(!S.sheet&&['dispute','disputes','app','job'].includes(S.screen)) render();
}
async function loadDPhoto(dsrv,mid){
  if(DIMG[mid]||DIMG_TRY[mid]===1) return; DIMG_TRY[mid]=1;
  const r=await tmApi('GET','/disputes/'+dsrv+'/photos/'+mid);
  if(r.ok&&r.j.img){ DIMG[mid]=r.j.img; delete DIMG_TRY[mid]; } else DIMG_TRY[mid]=2;
  if(S.screen==='dispute'&&!S.sheet) render();
}
function retryDPhoto(dsrv,mid){ delete DIMG_TRY[mid]; loadDPhoto(dsrv,mid); render(); }
function openDPhoto(mid){ if(!DIMG[mid]) return; S.photoView={src:DIMG[mid],nm:tr('d_photo_alt')}; render(); }
const dTurn=d=>{ if(!d.srv||d.status!=='open') return false; const ms=d.thread.filter(m=>m.by!=='system'), l=ms[ms.length-1];
  return l? l.by!==d.mine : d.mine==='vendor'; };       // an open dispute where the other side spoke last (or the vendor has not answered yet)
function openDispute(srvId){ S.disputeView=idn(srvId); S.dImg=null; go('dispute'); }
function dPhotoPicker(){       // the "add a photo" button, or the chosen photo with a remove button (one photo per message, like chat)
  return `<div class="dphoto">${S.dImg
    ?`<div class="chatimgprev"><img src="${S.dImg}" alt="${esc(tr('d_photo_alt'))}"><button onclick="clearDImg()" aria-label="${esc(tr('d_photo_remove'))}">✕</button></div>`

      <p class="tiny">${esc(tr('d_photo_hint'))}</p>`}</div>`;
}
async function pickDImg(el){

function scrDisputes(){
  const vend=S.role==='vendor';
  return `

  ${!S.disputes.length?`<div class="empty"><h3>${tr('d_none_title')}</h3><p class="small" style="margin:8px 0 0">${tr(vend?'d_none_v':'d_none_c')}</p></div>`:

    return `<div class="card">

function scrDispute(){
  const d=S.disputes.find(x=>x.srv&&x.id===S.disputeView);
  const back=`<button class="back" onclick="go('disputes')" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>`;
  if(!d) return `<div class="hdr">${back}<h2>${tr('d_dispute')}</h2></div><div class="empty"><h3>${tr('d_not_found_t')}</h3><p class="small" style="margin:8px 0 0">${tr('d_not_found_b')}</p></div>`;
  const vend=d.mine==='vendor', other=esc(d.otherName||'—'), first=other.split(' ')[0], open=d.status==='open';
  const bk=S.bookings.find(b=>b.srv===d.bookingSrv);
  d.thread.forEach(m=>{ if(m.img&&!DIMG[m.id]&&!DIMG_TRY[m.id]) loadDPhoto(d.srv,m.id); });      // fetch the photos this thread has, once
  const pic=m=>!m.img?'':DIMG[m.id]

function fillDReply(i){ const el=$('f-dreply'); if(!el) return; if(!el.value.trim()) el.value=tr('d_quick_'+i); el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length); }catch(e){} }
async function sendDispute(){
  const d=S.disputes.find(x=>x.srv&&x.id===S.disputeView), el=$('f-dreply'); if(!d||!el||dBusy||S.dImgBusy) return;
  const text=el.value.trim(), img=S.dImg; if(!text&&!img){ toast(tr('d_t_write')); return; }
  const body={text}; if(img) body.img=img;
  dBusy=true; const r=await tmApi('POST','/disputes/'+d.srv+'/reply',body); dBusy=false;
  if(!r.ok){ toast(r.j.error||tr('d_t_fail')); dSig=''; pullDisputes(); return; }
  const last=r.j.thread[r.j.thread.length-1]; if(img&&last&&last.img) DIMG[last.id]=img;       // keep our own copy, no need to fetch it back
  S.dImg=null; const el2=$('f-dreply'); if(el2) el2.value='';
  applyDispute(r.j); render();
}
async function closeDispute(){
  const d=S.disputes.find(x=>x.srv&&x.id===S.disputeView); if(!d||dBusy) return;
  if(!confirm(tr('d_t_confirm'))) return;
  dBusy=true; const r=await tmApi('POST','/disputes/'+d.srv+'/resolve'); dBusy=false;
  if(!r.ok){ toast(r.j.error||tr('d_t_closefail')); return; }
  S.dImg=null; applyDispute(r.j); bSig=''; pullBookings(); render(); toast(tr('d_t_closed'),3600);
}
function resolveDispute(id){
  const d=S.disputes.find(x=>x.id===id); if(d) d.status='resolved';

}

async function vfPhoto(k,el){
  const fl=el.files&&el.files[0];
  disarmResume();
  if(!fl) return;
  S.vf.err.photo=''; S.vf[k+'Proc']=true; render();
  try{ S.vf[k]=await shrinkPhoto(fl,{max:1280,q:0.82}); }
  catch(e){ S.vf.err.photo='That photo would not open. Please take it again.'; }
  S.vf[k+'Proc']=false; render();
}
function vfSubmit(sec){
  const f=S.vf; f.err={};
  if(sec==='nin'){
    if(!/^\d{11}$/.test(f.nin.replace(/\s/g,''))) f.err.nin='A NIN has 11 digits.';
    if(f.legal.trim().length<3) f.err.legal='Enter your name exactly as it appears on your ID.';
    if(!f.dob) f.err.dob='Add your date of birth.';
  } else if(sec==='photo'){
    if(!f.selfie||!f.idPhoto) f.err.photo='Add both a photo of yourself and a photo of your ID.';
  } else {
    if(f.addr.trim().length<8) f.err.addr='Add the address where you work.';
    if(!f.bank.trim()) f.err.bank='Add your bank.';
    if(!/^\d{10}$/.test(f.acct.replace(/\s/g,''))) f.err.acct='Account numbers have 10 digits.';
  }
  if(Object.keys(f.err).length){ render(); return; }
  f[sec+'Busy']=true; render();
  setTimeout(()=>{ f[sec+'Busy']=false; f[sec+'Ok']=true; render();
    toast({nin:'NIN accepted (simulated).',photo:'Photos accepted — your face matches your ID (simulated).',pay:'Details received. Bank account name matches your ID (simulated).'}[sec]); },1600);
}

function saveFile(filename,mime,text){
  const blob=new Blob([text],{type:mime}), url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; a.style.display='none';
  document.body.appendChild(a); a.click();

  if(!rows.length){ toast('No history to export yet.'); return; }

  });
  const stamp=new Date().toISOString().slice(0,10);
  saveFile('trustme-earnings-'+stamp+(r.j.live?'':'-test')+'.csv','text/csv;charset=utf-8;','\uFEFF'+lines.join('\r\n'));

/* ============ SAVED PROFILE ============
   The profile is kept in this browser (localStorage) so it is still here after the app is closed and reopened.
   Only this device has it. ID photos, the full NIN and the full account number are never written to storage:
   we keep the accepted/not-accepted state plus the last digits the screen shows. */
const SAVE_KEY='tm-profile-v1';
const SAVE_FIELDS=['name','phone','role','camp','batch','stream','needs','notif','bio','phase','day','vCat','vPkgName','vPkgFee','pic','myVendorId','bookings','messages','disputes','supportMsgs','tab','step','uid','lang'];
let saveTimer=null, wiped=false;
function snapshotProfile(){
  const o={}; SAVE_FIELDS.forEach(k=>{ o[k]=S[k]; });
  o.screen=(S.screen==='welcome'||S.screen==='onb')?S.screen:'app';
  const f=S.vf, sv={ninOk:!!f.ninOk,photoOk:!!f.photoOk,payOk:!!f.payOk};
  if(f.ninOk){ sv.nin=String(f.nin).replace(/\s/g,'').slice(-2); sv.legal=f.legal; }
  if(f.payOk){ sv.addr=f.addr; sv.bank=f.bank; sv.acct=String(f.acct).replace(/\s/g,'').slice(-4); }
  o.vf=sv;
  const mine=S.myVendorId?V.find(x=>x.id===S.myVendorId):null;
  return {v:1, PK:PK, S:o, mine:mine?Object.assign({},mine,{photo:null}):null};
}
function saveProfile(){
  if(wiped) return;
  try{
    const snap=snapshotProfile();
    try{ localStorage.setItem(SAVE_KEY,JSON.stringify(snap)); }
    catch(e){ snap.S.pic=null; localStorage.setItem(SAVE_KEY,JSON.stringify(snap)); }
  }catch(e){}
}
function queueSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveProfile,250); pushMe(); }
function restoreProfile(){
  try{
    const raw=localStorage.getItem(SAVE_KEY); if(!raw) return false;
    const d=JSON.parse(raw); if(!d||d.v!==1||!d.S) return false;
    const s=d.S;
    if(s.myVendorId && !d.mine) return false;
    SAVE_FIELDS.forEach(k=>{ if(s[k]!==undefined) S[k]=s[k]; });
    S.screen = (s.screen==='onb'||s.screen==='welcome') ? s.screen : 'app';
    S.tab = (s.tab==='book'||s.tab==='me') ? s.tab : 'home';
    if(s.vf) Object.assign(S.vf,s.vf);
    if(d.mine){ const i=V.findIndex(x=>x.id===d.mine.id); if(i>=0) V[i]=Object.assign(V[i],d.mine); else V.unshift(d.mine); }
    PK=Math.max(PK,d.PK||0);
    syncMyPhoto();
    return true;
  }catch(e){ return false; }
}
async function signOut(){
  if(!confirm('Sign out and clear the profile saved on this device?')) return;
  await pushDetach();      // this phone must stop getting this account's alerts
  wiped=true; clearTimeout(saveTimer);
  try{ localStorage.removeItem(SAVE_KEY); localStorage.removeItem('tm-token'); }catch(e){}
  disarmResume();
  location.reload();
}
document.addEventListener('input',queueSave);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') saveProfile(); });
window.addEventListener('pagehide',saveProfile);

/* ============ ALERTS ============
   Two layers. (1) An inbox on the server plus a bell here: works everywhere, and is what a person sees when they open the app.
   (2) A push to the phone, so a vendor accepting, work being finished or a message arriving is noticed with the app closed.
   The 8-second refresh above still runs while the app is in front; a push that arrives then just triggers it early. */
const BELL='<svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0112 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 004 0"/></svg>';
const isApple=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>!!(navigator.standalone||matchMedia('(display-mode: standalone)').matches);
const b64uToU8=s=>Uint8Array.from(atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const u8ToB64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const swReady=()=>Promise.race([navigator.serviceWorker.ready,new Promise((_,no)=>setTimeout(()=>no(new Error('sw')),4000))]);

function pushState(){        // 'on' | 'off' | 'denied' | 'install' (iPhone, not on the Home Screen yet) | 'unsupported'
  if(!('serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window)) return (isApple()&&!isStandalone())?'install':'unsupported';
  if(Notification.permission==='denied') return 'denied';
  return (S.notif&&Notification.permission==='granted'&&PUSH_OK!==false)?'on':'off';
}
function pushHint(){
  return {on:'On for this phone, even when the app is closed.',off:'Get a push when a vendor accepts, finishes, or messages you.',denied:'Blocked in your browser settings. Allow it there, then come back.',
    install:'On iPhone, add Trust Me to your Home Screen first, then turn this on from there.',unsupported:'This browser cannot send alerts while it is closed.'}[pushState()];
}
async function subscribePush(){       // registers this phone with the server; safe to run every time the app opens
  try{
    const reg=await swReady(), k=await tmApi('GET','/push/key'); if(!k.ok||!k.j.key) return PUSH_OK=false;
    let sub=await reg.pushManager.getSubscription();
    if(sub&&sub.options&&sub.options.applicationServerKey&&u8ToB64u(sub.options.applicationServerKey)!==k.j.key){ await sub.unsubscribe(); sub=null; }   // server keys changed
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(k.j.key)});
    const j=sub.toJSON(), r=await tmApi('POST','/push/subscribe',{endpoint:j.endpoint,keys:j.keys});

  }catch(e){ return PUSH_OK=false; }
}
async function enablePush(){
  if(!TOKEN){ toast('Alerts need you to be signed in and online.'); return false; }
  const st=pushState();
  if(st==='install'||st==='unsupported'||st==='denied'){ S.notif=false; render(); toast(pushHint(),4200); return false; }
  let perm=Notification.permission; if(perm==='default') perm=await Notification.requestPermission();      // must run from a tap
  if(perm!=='granted'){ S.notif=false; render(); toast(perm==='denied'?'Alerts are blocked. You can allow them in your browser settings.':'Alerts stay off for now.',3600); return false; }
  S.notif=true; const ok=await subscribePush(); if(!ok) S.notif=false; render();
  toast(ok?'Alerts are on. You will hear about bookings, payments and messages.':'Could not turn alerts on. Check your connection and try again.',3600); return ok;
}
async function pushDetach(){          // stop this phone receiving this account's alerts (turning off, or signing out)
  try{
    const work=(async()=>{ const reg=await swReady(), sub=await reg.pushManager.getSubscription();
      if(sub){ await tmApi('POST','/push/unsubscribe',{endpoint:sub.endpoint}); await sub.unsubscribe(); } })();
    await Promise.race([work,new Promise(r=>setTimeout(r,2500))]);
  }catch(e){}
}
async function setNotif(on){ if(on) return enablePush(); S.notif=false; PUSH_OK=null; render(); await pushDetach(); }
function syncPush(){                  // on every app open: keep the server's copy of this phone's address current
  if(!TOKEN||!('serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window)) return;
  if(Notification.permission==='denied'&&S.notif){ S.notif=false; render(); return; }
  if(S.notif&&Notification.permission==='granted'){ const was=pushState(); subscribePush().then(()=>{ if(pushState()!==was) render(); }); }
}

async function pullNotifs(){

  const j=r.j, sig=j.seq+':'+j.unread; if(sig===nSig) return; nSig=sig;
  const peer=S.screen==='vendorchat'?peerOf(S.contactVendor):null;
  const here=n=>n.kind==='message'&&peer&&peer.srv&&n.open==='chat:'+peer.srv;         // you are looking at that conversation right now
  const fresh=nSeq===null?[]:j.items.filter(n=>n.seq>nSeq&&!n.read&&!here(n));
  const read=j.items.filter(n=>!n.read&&here(n)); if(read.length){ tmApi('POST','/notifications/read',{ids:read.map(n=>n.id)}); read.forEach(n=>{ n.read=true; j.unread--; }); }
  nSeq=j.seq; S.notifs=j.items; S.unread=Math.max(0,j.unread);
  if(fresh.length&&!S.sheet) softToast(fresh.length===1?fresh[0].title+': '+fresh[0].body:fresh.length+' new updates',4200);
  else if(!S.sheet&&(S.screen==='app'||S.screen==='notifs')) softRender();     // only the screens that show the bell or the list
}
function pollAll(){ pullBookings(); pullMessages(); pullVendors(); pullWallet(); pullNotifs(); pullDisputes(); }
setInterval(()=>{ if(document.visibilityState==='visible') pollAll(); },8000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') pollAll(); });
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{
    const d=e.data||{};
    if(d.type==='push') pollAll();                                                       // a push landed while the app is open: refresh now, not in 8 seconds
    else if(d.type==='open'){ PENDING={o:d.open,at:Date.now()}; pollAll(); tryPending(); }   // an alert was tapped while the app was already open
  });
}
{ const q=new URLSearchParams(location.search).get('open'); if(q){ PENDING={o:q,at:Date.now()}; history.replaceState(null,'',location.pathname); } }   // an alert opened the app from closed

let resumed=false;
restoreProfile();
async function finishPayment(){       // back from the bank: confirm the payment, then open the booking
  if(!payRef||!TOKEN) return; history.replaceState(null,'',location.pathname);
  const r=await tmApi('POST','/payments/verify',{reference:payRef});
  if(!r.ok){ toast(r.j.error||'That payment was not completed.'); return; }
  bSig=''; await pullBookings(); const b=S.bookings.find(x=>x.srv===r.j.id);
  if(b){ S.booking=b.id; S.screen='job'; render(); toast(naira(b.price)+' held. '+vOf(b).nm.split(' ')[0]+' has 30 minutes to accept.'); }
}
tmApi('GET','/health').then(r=>{ PAYLIVE=!!(r.j&&r.j.payments); });
pullMe().then(()=>{ pullVendors(); pullBookings(); pullMessages(); pullWallet(); pullNotifs(); pullDisputes(); syncPush(); finishPayment(); });
try{
  if(sessionStorage.getItem('tm-resume')==='1'){
    const raw=sessionStorage.getItem('tm-snap');
    disarmResume();
    const snap=raw&&JSON.parse(raw);
    if(snap && Date.now()-snap.t<30*60*1000){
      V.splice(0,V.length,...snap.V);
      PK=Math.max(PK,snap.PK||0);
      Object.assign(S,snap.S,{toast:null});
      resumed=true;
    }
  }
}catch(e){}

loadTheme(); paintToggle();
$('tt').addEventListener('click',toggleTheme);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',paintToggle);
(function clock(){
  const d=new Date();
  $('clock').textContent=(d.getHours()%12||12)+':'+String(d.getMinutes()).padStart(2,'0');
  setTimeout(clock,20000);
})();
render();
if(resumed) toast('Your phone closed the page while the camera was open. You are back where you left off. Please add the photo again.',6000);
